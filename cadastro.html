<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - GlamBeauty</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>

    <div class="login">

        <h1>GLAM<span>BEAUTY</span></h1>

        <p>A BELEZA QUE ENTENDE SEU CICLO</p>

        <h2>CADASTRO</h2>

        <form id="formCadastro">

            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>

            <label for="confirmarSenha">Confirmar senha</label>
            <input type="password" id="confirmarSenha" placeholder="Confirme sua senha" required>

            <button type="submit">CADASTRAR</button>

        </form>

        <a href="login.html">Já tenho uma conta</a>

        <a href="index.html">Voltar para o início</a>

        <p id="mensagem"></p>

    </div>

    <script>
        document.getElementById("formCadastro").addEventListener("submit", function(event) {

            event.preventDefault();

            var senha = document.getElementById("senha").value;
            var confirmarSenha = document.getElementById("confirmarSenha").value;
            var mensagem = document.getElementById("mensagem");

            if (senha !== confirmarSenha) {
                mensagem.textContent = "As senhas não são iguais.";
                return;
            }

            mensagem.textContent = "Cadastro preenchido com sucesso!";

        });
    </script>

</body>

</html>
